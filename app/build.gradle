plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sysnova.cbfdailyproductionapp'
    compileSdk 33

    defaultConfig {
        applicationId "com.sysnova.cbfdailyproductionapp"
        minSdk 24
        targetSdk 33
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        multiDexEnabled true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {

    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    implementation 'androidx.core:core-ktx:1.3.2'
    implementation files('libs/apache-httpcomponents-httpcore.jar')
    implementation files('libs/httpclient-4.2.3.jar')
    implementation files('libs/picasso-2.5.2.jar')
    implementation files('libs/postgresql-9.1-901.jdbc3.jar')
    implementation'commons-logging:commons-logging-api:1.1'
    implementation 'com.android.volley:volley:1.2.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation("androidx.annotation:annotation:1.3.0")
    implementation "androidx.multidex:multidex:2.0.1"
    implementation "androidx.recyclerview:recyclerview-selection:1.1.0"
    implementation project(path: ':searchablespinnerlibrary')
    implementation 'org.osmdroid:osmdroid-android:6.1.16'
    implementation 'com.journeyapps:zxing-android-embedded:4.1.0'
}